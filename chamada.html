<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#17100d"><title>Chamada · EBD IADP</title>
<style>
:root{color-scheme:dark;--bg:#17100d;--card:#251a16;--line:#3b2b25;--text:#f7eee9;--muted:#b8a9a2;--gold:#f7b936;--peach:#e8aa91}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{width:min(720px,100%);margin:auto;padding:24px 20px calc(32px + env(safe-area-inset-bottom))}.brand{display:flex;align-items:center;gap:12px;margin:8px 0 32px}.logo{width:44px;height:44px;border-radius:12px;background:var(--gold);color:#21150e;display:grid;place-items:center;font-weight:800;font-size:23px}.brand small{display:block;color:var(--muted)}h1{font-size:28px;line-height:1.2;margin:0 0 6px}.sub{color:var(--muted);margin:0 0 22px}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}.students{display:grid;gap:9px;margin:16px 0}.student{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:13px 14px;background:#1c1411;border:1px solid var(--line);border-radius:13px;color:var(--text);font:inherit;cursor:pointer}.student input{accent-color:var(--gold);width:19px;height:19px}.student.on{border-color:var(--gold)}.btn{width:100%;border:0;border-radius:14px;background:var(--gold);color:#21150e;padding:14px 18px;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55}.notice{padding:14px 16px;border-radius:12px;background:#30231d;color:var(--muted);margin-top:14px}.error{color:#ffd0c4}.footer{text-align:center;color:var(--muted);font-size:13px;margin:18px 0 0}@media(min-width:600px){.wrap{padding-top:40px}.panel{padding:24px}}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script></head>
<body><main class="wrap"><header class="brand"><div class="logo">♨</div><div><b>Escola Bíblica Dominical</b><small>EBD IADP · chamada compartilhada</small></div></header><section id="app" class="panel"><p>Carregando chamada…</p></section><p class="footer">O link é individual para esta turma e pode ser usado uma vez.</p></main>
<script>
const URL_SB='https://dltijyufuyiienzkzryz.supabase.co',KEY='sb_publishable_oLAxJxwJwHbh_pMYfRU7kQ_NJXDuMe0';
const app=document.getElementById('app'),token=location.hash.slice(1),client=window.supabase?.createClient(URL_SB,KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});let people=[],selected=new Set(),used=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function showError(s){app.innerHTML='<h1>Não foi possível abrir</h1><p class="notice error">'+esc(s)+'</p><p class="sub">Peça à equipe um novo link de chamada.</p>'}
function draw(d){people=d.alunos||[];selected=new Set(d.presentes||[]);used=!!d.usado;const date=new Date(d.data+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});app.innerHTML='<h1>Chamada · '+esc(d.turma)+'</h1><p class="sub" style="text-transform:capitalize">'+esc(date)+'</p>'+(used?'<div class="notice">Esta chamada já foi enviada. Presenças salvas: '+selected.size+'.</div>':'<p class="sub">Marque quem está presente e toque em enviar.</p><div class="students">'+people.map(p=>'<label class="student '+(selected.has(p.id)?'on':'')+'"><input type="checkbox" data-id="'+esc(p.id)+'" '+(selected.has(p.id)?'checked':'')+'><span>'+esc(p.nome)+'</span></label>').join('')+'</div><button class="btn" id="save">Enviar chamada</button><div id="msg" aria-live="polite"></div>');app.querySelectorAll('[data-id]').forEach(c=>c.addEventListener('change',()=>{c.checked?selected.add(c.dataset.id):selected.delete(c.dataset.id);c.closest('.student').classList.toggle('on',c.checked)}));const b=document.getElementById('save');if(b)b.addEventListener('click',save)}
async function load(){if(!token||!/^[0-9a-f]{64}$/.test(token)){showError('Link inválido.');return}if(!client){showError('Falha ao conectar. Tente novamente mais tarde.');return}try{const {data,error}=await client.rpc('obter_chamada_publica',{p_token:token});if(error)throw error;if(!data?.ok){showError(data?.error||'Link inválido ou expirado.');return}draw(data)}catch(e){console.error(e);showError('Falha ao carregar os dados. O administrador precisa ativar a chamada sem login no sistema.')}}
async function save(){const b=document.getElementById('save'),m=document.getElementById('msg');b.disabled=true;b.textContent='Enviando…';try{const {data,error}=await client.rpc('salvar_chamada_publica',{p_token:token,p_presentes:[...selected]});if(error)throw error;if(!data?.ok)throw new Error(data?.error||'Não foi possível enviar.');used=true;app.innerHTML='<h1>Chamada enviada</h1><p class="notice">Presenças salvas com sucesso. Obrigado!</p>';}catch(e){b.disabled=false;b.textContent='Enviar chamada';m.className='notice error';m.textContent=e.message||'Não foi possível enviar. Tente novamente.'}}
load();
</script></body></html>
