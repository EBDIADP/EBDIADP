.sk{display:grid;gap:12px;padding:4px 0}.sk i{display:block;height:64px;border-radius:14px;background:linear-gradient(90deg,var(--soft) 25%,var(--line) 50%,var(--soft) 75%);background-size:200% 100%;animation:sk 1.2s linear infinite}.sk:not(.f) i:first-child{height:120px}@keyframes sk{to{background-position:-200% 0}}@media (prefers-reduced-motion:reduce){.sk i{animation:none}}

:root{--bg:#FAFAF9;--surface:#FFFFFF;--ink:#1C1917;--muted:#78716C;--line:#E7E5E4;--brand:#462410;--onbrand:#FFF7ED;--accent:#F59E0B;--ok:#16A34A;--bad:#DC2626;--navy:#1C1917;--soft:#F5F5F4;--shadow:0 1px 2px rgba(28,25,23,.05);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0C0A09;--surface:#1C1917;--ink:#FAFAF9;--muted:#A8A29E;--line:#2B2623;--brand:#E7E5E4;--onbrand:#1C1917;--soft:#292524;--navy:#0C0A09;--ok:#5CC49A;--bad:#E8806F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;padding-bottom:84px}
h1,h2{font-family:Outfit,Figtree,sans-serif;margin:0;letter-spacing:-.01em}
header{background:var(--brand);color:var(--onbrand);padding:20px 20px 18px}
header h1{font-size:26px;font-weight:800}
header{position:relative;padding-right:64px}
#tema{position:absolute;top:50%;right:14px;transform:translateY(-50%);width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:17px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
header p{margin:2px 0 0;opacity:.8;font-size:14px}
main{max-width:640px;margin:0 auto;padding:20px}
h2{font-size:20px;font-weight:600;margin-bottom:12px}
label{display:block;font-size:14px;font-weight:500;margin:12px 0 4px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
textarea{min-height:76px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--brand);color:var(--onbrand);border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;margin-top:14px}
.btn.full{width:100%}
.sub{color:var(--muted);font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px}
.row{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:0;border-bottom:1px solid var(--line);padding:14px 12px;text-align:left;cursor:pointer}
.row:first-of-type{border-top-left-radius:10px;border-top-right-radius:10px}
.row:last-of-type{border-bottom-left-radius:10px;border-bottom-right-radius:10px;border-bottom:0}
.list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.list .row{border-radius:0}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:15px;font-weight:700;color:transparent}
.row[aria-pressed="true"] .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.row[aria-pressed="true"] .st{color:var(--ok)}
.st{margin-left:auto;font-size:14px;font-weight:700;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.freq{padding:12px;border-bottom:1px solid var(--line);background:var(--surface)}
.freq:last-child{border-bottom:0}
.freq div{display:flex;justify-content:space-between}
.item{padding:14px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item b{display:block}
.nbadge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--accent);color:#1B2B27;font-size:11px;font-weight:800;text-align:center;margin-left:6px;padding:0 5px;vertical-align:middle}
.novas{background:var(--surface);border:1px solid var(--accent);border-left-width:6px;border-radius:12px;padding:12px 14px;margin:0 0 16px}
.novas b{display:block}
.novas .sub{display:block;margin-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:700;background:var(--accent);color:#1B2B27;border-radius:4px;padding:1px 7px;margin-right:6px}
.sec{margin-top:28px;padding-top:6px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:14px 4px;font-weight:700;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.note{font-size:13px;color:var(--muted);margin-top:28px}
details.dt{border-bottom:1px solid var(--line);background:var(--surface)}
details.dt:last-child{border-bottom:0}
details.dt summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 12px;cursor:pointer;list-style:none}
details.dt summary::-webkit-details-marker{display:none}
details.dt summary span{display:block}
details.dt summary>b{font-size:20px}
details.dt .freq{padding-left:24px;border-bottom:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px;background:var(--surface);border-bottom:1px solid var(--line)}
.list>.kv:last-child{border-bottom:0}
details.dt .kv{padding-left:24px;font-size:15px}
nav{overflow-x:auto;scrollbar-width:none}
nav button{flex:1 0 auto;padding:14px 10px;font-size:14px;white-space:nowrap}
.al{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.al.off span{color:var(--muted);text-decoration:line-through}
.tg{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;color:var(--muted)}
.tg[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.acts{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.tg.bad{color:var(--bad);border-color:var(--bad)}
.chkl{display:flex;align-items:center;gap:10px;margin:14px 0 0;font-size:16px;font-weight:400}
.chkl input{width:20px;height:20px;margin:0;accent-color:var(--brand)}
.tot{background:var(--brand);color:var(--onbrand);border-radius:10px;padding:16px;margin:12px 0 4px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:14px;margin-top:10px}
.tot .n{display:block;font:800 28px/1.1 Outfit,Figtree,sans-serif}
.tot .l{display:block;font-size:13px;opacity:.85}
.subnav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
.subnav[hidden]{display:none}
.subnav button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer}
.subnav button[aria-current="page"]{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* Visual estilo shadcn: neutro quente + marrom do logo */
html,body{background:var(--bg);min-height:100%}
header{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);border-radius:0;padding:12px 60px 12px 16px;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}
header img{grid-row:1/3;width:42px;height:auto;box-sizing:content-box;padding:5px;background:#F8F8F8;border-radius:8px;display:block}
header h1{font-size:17px;font-weight:600;line-height:1.2}
header p{color:var(--muted);opacity:1;margin:2px 0 0;font-size:13px}
main{max-width:760px;margin:0 auto;position:relative}
.subnav{background:transparent;border:0;padding:12px 20px 0;margin-top:0;position:relative;top:auto;max-width:760px;margin-inline:auto}
.subnav:not([hidden])+main{margin-top:0}
.subnav button{border-radius:8px;border-color:var(--line);font-weight:500;padding:7px 14px}
.list{border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);background:var(--surface)}
.row,.item,.freq,.kv,details.dt{background:transparent}
.tot{border-radius:10px;background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.tot .l{opacity:1;color:var(--muted)}
.tgrid{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.tgrid>*{background:var(--soft);border-radius:8px;padding:12px}
.tgrid>*:first-child{grid-column:span 2}
.btn{border-radius:8px;box-shadow:none;font-weight:500;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.99)}
input,select,textarea{border-radius:8px}
h2{font-size:20px;font-weight:600}
h1,h2{font-family:Figtree,system-ui,sans-serif}
.tot .n{font-family:Figtree,system-ui,sans-serif;font-weight:700}
.tag{border-radius:6px}
.novas{border-radius:10px;border-width:1px;border-left-width:4px}
.meter{height:6px;border-radius:3px}
.meter i{background:var(--brand)}
nav{left:0;right:0;transform:none;bottom:0;width:auto;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:4px}
nav button{border-top:0;border-radius:8px;padding:9px 12px;font-weight:500}
nav button[aria-current="page"]{background:var(--soft);color:var(--ink);box-shadow:inset 0 2px 0 var(--accent)}
#toast{border-radius:8px;bottom:80px}
.tg{border-radius:8px;font-weight:500}

.subnav{flex-wrap:wrap;overflow:visible}
details.more{position:relative;margin-left:auto}
details.more summary{list-style:none;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;font-size:22px;font-weight:800;color:var(--muted);line-height:1}
details.more summary::-webkit-details-marker{display:none}
details.more summary:hover,details.more[open] summary{background:var(--soft);color:var(--ink)}
details.more .menu{position:absolute;right:0;top:40px;z-index:5;background:var(--surface);border-radius:14px;border:1px solid var(--line);box-shadow:0 8px 24px -10px rgba(28,25,23,.25);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:150px}
details.more .menu .tg{width:100%;text-align:left;border-radius:10px}
.list{overflow:visible}
.list:has(details.more[open]){position:relative;z-index:10}
details.more[open]{z-index:10}
@media (max-width:600px){
.subnav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:12px 12px 0;overflow:visible}
.subnav[hidden]{display:none}
.subnav button{padding:9px 4px;font-size:13px;min-width:0;text-align:center}
}


/* cores por turma (preenchido) e por título (contorno) */
.tag.ct0{background:#A5F3FC;color:#164E63}.tag.ct1{background:#E9D5FF;color:#581C87}.tag.ct2{background:#BFDBFE;color:#1E3A8A}.tag.ct3{background:#FBCFE8;color:#831843}
.tag.ct4{background:#BBF7D0;color:#14532D}.tag.ct5{background:#FDE68A;color:#78350F}.tag.ct6{background:#FECACA;color:#7F1D1D}.tag.ct7{background:#E2E8F0;color:#1E293B}
:root[data-theme="dark"] .tag.ct0{background:#164E63;color:#A5F3FC}:root[data-theme="dark"] .tag.ct1{background:#581C87;color:#E9D5FF}:root[data-theme="dark"] .tag.ct2{background:#1E3A8A;color:#BFDBFE}:root[data-theme="dark"] .tag.ct3{background:#831843;color:#FBCFE8}
:root[data-theme="dark"] .tag.ct4{background:#14532D;color:#BBF7D0}:root[data-theme="dark"] .tag.ct5{background:#78350F;color:#FDE68A}:root[data-theme="dark"] .tag.ct6{background:#7F1D1D;color:#FECACA}:root[data-theme="dark"] .tag.ct7{background:#334155;color:#E2E8F0}
.tag.tt{background:transparent;border:1.5px solid currentColor;padding:0 6px}

:root[data-theme="dark"] .tt-pr{color:#A5B4FC}:root[data-theme="dark"] .tt-pra{color:#F0ABFC}:root[data-theme="dark"] .tt-miss{color:#5EEAD4}:root[data-theme="dark"] .tt-pb{color:#93C5FD}:root[data-theme="dark"] .tt-coop{color:#FCD34D}:root[data-theme="dark"] .tt-dc{color:#86EFAC}:root[data-theme="dark"] .tt-mem{color:#CBD5E1}
@media print{:root,:root[data-theme="dark"]{--bg:#fff;--surface:#fff;--ink:#1C1917;--muted:#78716C;--line:#E7E5E4;--soft:#F5F5F4}header,nav,.subnav,#toast,.noprint{display:none!important}body{background:#fff;padding:0}main{max-width:none;padding:0}}

/* ===== Rebranding EBD v4 (design enviado: marrom escuro, âmbar e pêssego) ===== */
@media screen{
:root{--bg:#E9E5E0;--surface:#FFFFFF;--ink:#1F1611;--muted:#7A6D64;--line:#E4DED8;--brand:#1F1611;--onbrand:#F3EBE4;--accent:#F5B83D;--soft:#EFEAE5;--navy:#1F1611;--peach:#E5AE92;--shadow:none}
:root[data-theme="dark"]{--bg:#15100D;--surface:#241A15;--ink:#F3EBE4;--muted:#A8998E;--line:#33271F;--brand:#F5B83D;--onbrand:#1F1611;--soft:#3C2E26;--navy:#241A15;--peach:#E5AE92;--ok:#5CC49A;--bad:#E8806F}
body{padding-bottom:104px}

.av,.who,.srch{display:none}

 h+='<div class="list" style="margin-top:10px">'+(rows.length?lista.map(r=>{const au=S.aulas.find(x=>x.turma===t.id&&x.data===r.d);
