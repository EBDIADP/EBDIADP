const triFaixa=(a,q)=>[a+'-'+String((q-1)*3+1).padStart(2,'0')+'-01',a+'-'+String(q*3).padStart(2,'0')+'-31'];

 const [i,f]=triFaixa(rAno,rTri),pa=rTri===1?[rAno-1,4]:[rAno,rTri-1],[pi,pf]=triFaixa(pa[0],pa[1]);
 const all=TV().map(t=>({t,m:metrT(t,i,f),a:metrT(t,pi,pf)})),som=(k,o)=>all.reduce((n,x)=>n+x[o||'m'][k],0);

 const vs=(a,b,fm)=>b>0?'<span class="sub"> · '+(a>=b?'+':'−')+fm(Math.abs(a-b))+' sobre o trimestre anterior</span>':'';
 const ys=Object.keys(S.pres).map(k=>+k.slice(0,4)),y0=Math.min(today.getFullYear(),...ys);let anos='';for(let y=today.getFullYear();y>=y0;y--)anos+='<option'+(y===rAno?' selected':'')+'>'+y+'</option>';

 +all.map(({t,m})=>'<div class="sec"><h2>'+esc(t.nome)+'</h2>'+(m.n?'<div class="list">'+kv('Aulas com chamada',m.n)+kv('Alunos ativos',ativos(t).length)+kv('Frequência média',m.p+'%')+kv('Média de presentes por aula',m.media)+kv('Faltas (justificadas)',(m.poss-m.pres-m.jus)+' ('+m.jus+')')+kv('Visitantes',m.vis||'Nenhum')+kv('Bíblias físicas',m.bib)+kv('Contribuições',brl(m.of))+'</div>'
  +(m.integral.length?'<p class="sub"><b>Presença integral:</b> '+m.integral.map(x=>esc(nm(x.a))).join(', ')+'.</p>':'')
  +'<details class="dt"><summary><b>Frequência por aluno</b></summary>'+m.al.map(x=>'<div class="freq"><div><span>'+esc(nm(x.a))+'</span><b>'+(x.n?x.q+'%':'—')+'</b></div><span class="sub">'+(x.n?x.p+' de '+x.n+' aula(s)':'Sem chamadas no período')+'</span></div>').join('')+'</details>'
  :'<div class="list"><div class="item sub">Sem chamada salva neste trimestre.</div></div>')+'</div>').join('');
}

  +'<label for="bkc">Digite RESTAURAR para confirmar</label><input id="bkc" autocomplete="off"'+dis+'><div class="acts"><button class="btn" data-bkgo="1"'+dis+'>Restaurar agora</button><button class="tg" data-bkno="1"'+dis+'>Cancelar</button></div>'
  :'<p class="sub">Escolha um backup .json gerado por esta tela. Nada é alterado antes da sua confirmação.</p><label for="bkf">Arquivo de backup</label><input id="bkf" type="file" accept=".json,application/json"'+dis+'>';
 return '<h2>Backup e restauração</h2><p class="sub">Baixe uma cópia dos dados com frequência e guarde fora do celular (Google Drive da igreja e mais um lugar). As contas de login (e-mail e senha) ficam no Supabase e não entram no backup.</p>'
  +(bkOcupado?'<div class="novas" role="status"><b>Aguarde…</b></div>':bkMsg?'<div class="novas" role="status"><b>'+esc(bkMsg)+'</b></div>':'')
  +'<div class="sec"><h2>Baixar</h2><p class="sub">Último backup baixado neste aparelho: '+esc(lerUlt()||'nenhum')+'</p><button class="btn full" data-bkj="1"'+dis+'>Baixar backup completo (.json)</button><button class="btn full" data-bkc="1"'+dis+'>Baixar chamadas para Excel (.csv)</button></div>'
  +'<div class="sec"><h2>Restaurar</h2>'+conf+'</div>'}
$('#app').addEventListener('change',e=>{if(e.target.id==='bkf'&&e.target.files[0])bkLer(e.target.files[0])});
$('#app').addEventListener('click',e=>{const c=k=>e.target.closest(k);
 if(c('[data-bkj]'))bkBaixar();else if(c('[data-bkc]'))bkCsv();else if(c('[data-bkgo]'))bkRestaurar();else if(c('[data-bkno]')){BK=null;bkMsg='';render()}});
async function boot(){
 vistos=null;F=novoF();
 if(!sb){acesso='config';me=null;render();return}
 if(modo==='nova'){acesso='';me=null;render();return}
 const {data:{session}}=await sb.auth.getSession();
 if(!session){me=null;S=vazio();acesso='';render();return}
 const {data:p,error}=await sb.from('perfis').select('*').eq('id',session.user.id).maybeSingle();
 if(error){toast('Erro ao conectar. Tente novamente.');me=null;acesso='';render();return}
 if(!p||!p.ativo){me=null;acesso='pendente';pendNome=(p&&(p.nome||p.email))||session.user.email||'';render();return}
 me={id:p.id,nome:p.nome||p.email,login:p.email,perfil:p.perfil,ativo:true,alunoId:p.aluno_id||null,turmaId:p.turma_id||null,extras:Array.isArray(p.perfis_extra)?p.perfis_extra:[]};acesso='';
 try{await pull();if(me.perfil==='admin'){await pullUsers();if(!S.turmas.length){S.turmas=seed().turmas;norm();save()}}}catch(e){toast('Erro ao carregar os dados')}
 if(ehEquipe()&&me.turmaId)cur=me.turmaId;view=can('painel')?'painel':'chamada';render();scrollTo(0,0);if(me.perfil==='admin')avisaNovas()}
$('#app').addEventListener('click',async e=>{
 const id=e.target.id,B=e.target.closest('[data-ue],[data-ud],[data-uok],[data-uno],[data-uek]'),D=B?B.dataset:{};
 if(id==='irCriar'||id==='irEntrar'){modo=id==='irCriar'?'criar':'entrar';render();return}
 if(id==='esqueci'){const em=$('#lg').value.trim();if(!em){toast('Digite seu e-mail primeiro');return}const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split('#')[0]});toast(error?'Não foi possível enviar o e-mail':'Enviamos um link para redefinir a senha');return}
 if(id==='sairPend'){await sb.auth.signOut();acesso='';modo='entrar';render();return}
 if(id==='entrar'){const em=$('#lg').value.trim().toLowerCase(),sn=$('#ls').value;if(!em||!sn){toast('Informe e-mail e senha');return}
  const {error}=await sb.auth.signInWithPassword({email:em,password:sn});if(error){toast('E-mail ou senha incorretos');return}await boot();return}
 if(id==='criarConta'){const n=capNome($('#cn').value),em=$('#cl').value.trim().toLowerCase(),sn=$('#cs').value;
  if(!n||!em){toast('Informe nome e e-mail');return}if(sn.length<6){toast('A senha precisa ter ao menos 6 caracteres');return}if(sn!==$('#cr').value){toast('As senhas não conferem');return}
  const {data,error}=await sb.auth.signUp({email:em,password:sn,options:{data:{nome:n},emailRedirectTo:location.href.split('#')[0]}});
  if(error){toast('Não foi possível criar a conta: '+error.message);return}
  if(data.session){await boot()}else{modo='entrar';render();toast('Conta criada. Confirme pelo e-mail e depois entre.')}return}
 if(id==='salvarSenha'){const sn=$('#ns').value;if(sn.length<6){toast('A senha precisa ter ao menos 6 caracteres');return}
  const {error}=await sb.auth.updateUser({password:sn});if(error){toast('Não foi possível salvar a senha');return}
  modo='entrar';history.replaceState(null,'',location.pathname);toast('Senha alterada');await boot();return}
 if(!me||me.perfil!=='admin')return;
 if(e.target.closest('[data-rev]')){view='usuarios';sub='usuarios';editU='';delU='';render();scrollTo(0,0);return}
 if(D.ue){editU=D.ue;delU='';render();return}
 if(D.ud){delU=D.ud;editU='';render();return}
 if(D.uno){editU='';delU='';render();return}
 if(D.uok){const u=S.usuarios.find(x=>x.id===D.uok);if(!u||u.id===me.id)return;
  if(u.perfil==='admin'&&u.ativo!==false&&admins().length<2){toast('Precisa existir ao menos um administrador ativo');return}
  const {error}=await sb.from('perfis').delete().eq('id',u.id);if(error){toast('Não foi possível excluir');return}
  S.usuarios=S.usuarios.filter(x=>x.id!==u.id);delU='';toast('Usuário excluído');render();return}
 if(D.uek){const u=S.usuarios.find(x=>x.id===D.uek);if(!u)return;const n=capNome($('#eun').value),pf=$('#eup').value,at=$('#eua').checked,al=$('#eul').value||null,tu=(pf==='lider'||pf==='secretario')?($('#eut').value||null):null,ex2=($('#eutes')&&$('#eutes').checked)?['tesoureiro']:[];
  if(!n){toast('Informe o nome');return}
  if(u.id===me.id&&!at){toast('Você não pode desativar a si mesmo');return}
  if(u.perfil==='admin'&&u.ativo!==false&&!(pf==='admin'&&at)&&admins().length<2){toast('Precisa existir ao menos um administrador ativo');return}
  if(al){const dup=S.usuarios.find(x=>x.id!==u.id&&x.aluno_id===al);if(dup){toast('Esse aluno já está vinculado a '+dup.nome);return}}
  const {error}=await sb.from('perfis').update(Object.assign({nome:n,perfil:pf,ativo:at,aluno_id:al,turma_id:tu},extraCol?{perfis_extra:ex2}:{})).eq('id',u.id);if(error){toast('Não foi possível salvar: '+error.message);return}
  u.nome=n;u.perfil=pf;u.ativo=at;u.aluno_id=al;u.turma_id=tu;if(extraCol)u.extras=ex2;if(at&&!u.aprovado_em)u.aprovado_em=new Date().toISOString();editU='';toast('Usuário atualizado');render();return}
});
if(sb)sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){modo='nova';me=null;render()}});
document.addEventListener('visibilitychange',async()=>{if(document.visibilityState!=='visible'||!me||pend)return;
 try{await pull();if(me.perfil==='admin'){await pullUsers();avisaNovas()}const ae=document.activeElement;if(!ae||!/INPUT|TEXTAREA|SELECT/.test(ae.tagName))render()}catch(x){}});

render();
boot();

}

startEbd();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
